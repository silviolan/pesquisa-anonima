<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário da Área</title>
<style>
  :root{
    --navy-dark:#0F1E3C;
    --navy:#1F3864;
    --navy-soft:#2C3E5E;
    --gold:#C9A24B;
    --gold-light:#E7CE8C;
    --bg:#F4F6FB;
    --card:#FFFFFF;
    --text-dark:#1A2333;
    --text-mute:#6B7686;
    --green:#1E8E5A;
    --amber:#B6862F;
    --red:#C0392B;
    --line:#E4E8F0;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text-dark);
    font-family:'Segoe UI', Calibri, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 20px 60px;}
  .hero{
    background:linear-gradient(160deg, var(--navy-dark), var(--navy));
    color:#fff; padding:44px 20px 34px; text-align:left;
  }
  .hero-inner{max-width:760px;margin:0 auto;}
  .eyebrow{
    font-size:12px; letter-spacing:2px; color:var(--gold-light);
    text-transform:uppercase; margin:0 0 10px;
  }
  h1{
    font-family:Georgia, 'Times New Roman', serif; font-weight:700;
    font-size:30px; line-height:1.25; margin:0 0 12px; max-width:600px;
  }
  .hero p{color:#B9C4DC; font-size:15px; line-height:1.55; max-width:560px; margin:0;}

  .card{
    background:var(--card); border-radius:14px; padding:28px 28px 24px;
    margin-top:-28px; box-shadow:0 12px 28px rgba(15,30,60,0.10);
    border:1px solid var(--line);
  }

  .progress-row{display:flex; align-items:center; gap:8px; margin-bottom:22px;}
  .dot{
    flex:1; height:5px; border-radius:3px; background:var(--line); transition:background .25s;
  }
  .dot.done{background:var(--gold);}
  .dot.current{background:var(--navy);}
  .step-label{font-size:12px; color:var(--text-mute); letter-spacing:1px; text-transform:uppercase; margin-bottom:4px;}
  .step-title{font-family:Georgia, serif; font-size:22px; margin:0 0 6px; color:var(--navy);}
  .step-sub{font-size:13.5px; color:var(--text-mute); margin:0 0 22px; line-height:1.5;}

  .question{margin-bottom:26px;}
  .question:last-child{margin-bottom:6px;}
  .q-text{font-size:15px; font-weight:600; margin-bottom:12px; color:var(--text-dark); line-height:1.4;}
  .scale{display:flex; gap:6px; flex-wrap:wrap;}
  .scale button{
    width:38px; height:38px; border-radius:9px; border:1.5px solid var(--line);
    background:#fff; font-size:14px; font-weight:600; color:var(--text-mute);
    cursor:pointer; transition:all .15s;
  }
  .scale button:hover{border-color:var(--gold); color:var(--navy);}
  .scale button.selected{
    background:var(--navy); border-color:var(--navy); color:#fff;
  }
  .scale-labels{display:flex; justify-content:space-between; font-size:11px; color:var(--text-mute); margin-top:6px; max-width:340px;}

  textarea{
    width:100%; min-height:110px; border-radius:10px; border:1.5px solid var(--line);
    padding:12px 14px; font-family:inherit; font-size:14px; resize:vertical; color:var(--text-dark);
  }
  textarea:focus, .scale button:focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  .nav-row{display:flex; justify-content:space-between; align-items:center; margin-top:28px;}
  .btn{
    border:none; border-radius:9px; padding:12px 22px; font-size:14.5px; font-weight:600;
    cursor:pointer; transition:transform .1s, opacity .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--navy); color:#fff;}
  .btn-primary:hover{background:var(--navy-soft);}
  .btn-ghost{background:transparent; color:var(--text-mute);}
  .btn-ghost:hover{color:var(--navy);}
  .btn-gold{background:var(--gold); color:var(--navy-dark);}
  .btn-gold:hover{opacity:.9;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}

  .hint{font-size:12.5px; color:var(--amber); margin-top:10px; display:none;}
  .hint.show{display:block;}

  .intro-points{list-style:none; margin:20px 0 0; padding:0;}
  .intro-points li{
    display:flex; gap:10px; font-size:14px; color:var(--text-dark); margin-bottom:12px; line-height:1.5;
  }
  .intro-points li .ic{color:var(--gold); font-weight:700;}

  .thanks-icon{
    width:56px; height:56px; border-radius:50%; background:var(--green); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:18px;
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <p>Suas respostas são anônimas. Leva cerca de 8 minutos.</p>
  </div>
</div>

<div class="wrap">
  <div class="card" id="app"></div>
</div>

<script>
(function(){
  // ==========================================================================
  // CONFIGURAÇÃO
  // Se você hospedar ESTE HTML separado do back-end (ex.: GitHub Pages),
  // coloque aqui a URL do serviço no Render, ex.: "https://pesquisa-clima.onrender.com".
  // Se o back-end servir este arquivo (recomendado), deixe vazio ("").
  // ==========================================================================
  const API_BASE = "";

  const CATEGORIES = [
    {
      key: "lideranca",
      title: "Liderança e confiança",
      sub: "Como você enxerga a relação com a liderança direta.",
      questions: [
        { id: "lideranca", text: "Confio na liderança da área para nos guiar na direção certa." },
        { id: "competencia_lider", text: "Meu líder direto é tecnicamente e gerencialmente competente." },
        { id: "comunicacao_lider", text: "Meu líder se comunica comigo de forma clara e com a frequência necessária." },
        { id: "confianca", text: "Eu confio no meu líder direto." },
        { id: "qualidade_relacionamento", text: "Tenho um bom relacionamento com meu líder direto." },
        { id: "justica", text: "Sinto que sou tratado(a) de forma justa em comparação aos meus colegas." },
      ],
      open: "Descreva uma situação concreta em que você sentiu (ou não sentiu) que podia confiar no seu líder direto.",
    },
    {
      key: "empresa_carreira",
      title: "Empresa e carreira",
      sub: "Seu alinhamento com a empresa e suas perspectivas de crescimento.",
      questions: [
        { id: "alinhamento_empresa", text: "Entendo e estou alinhado(a) com os objetivos e valores da empresa/área." },
        { id: "carreira", text: "Enxergo perspectivas claras de crescimento de carreira aqui." },
        { id: "desenvolvimento_profissional", text: "Tenho tido oportunidades reais de desenvolver minhas competências profissionais." },
        { id: "autonomia", text: "Tenho autonomia para tomar decisões no meu trabalho." },
        { id: "oportunidades_desenvolvimento", text: "A área oferece oportunidades concretas de capacitação e crescimento." },
        { id: "embaixadorismo", text: "Eu recomendaria esta área/empresa como um ótimo lugar para trabalhar." },
      ],
      open: "O que precisaria acontecer para você enxergar um caminho de crescimento real aqui nos próximos 12 meses?",
    },
    {
      key: "feedback",
      title: "Feedback e reconhecimento",
      sub: "Frequência, qualidade e percepção sobre feedback e reconhecimento.",
      questions: [
        { id: "feedback_reconhecimento", text: "De forma geral, sinto que recebo feedback e reconhecimento adequados." },
        { id: "autopercepcao", text: "Tenho clareza sobre como meu trabalho é percebido pela liderança e pelos colegas." },
        { id: "frequencia_feedback", text: "Recebo feedback com a frequência que preciso." },
        { id: "frequencia_reconhecimento", text: "Sou reconhecido(a) com a frequência que mereço." },
        { id: "qualidade_feedback", text: "O feedback que recebo é claro, específico e útil." },
        { id: "qualidade_reconhecimento", text: "O reconhecimento que recebo é genuíno e relevante." },
      ],
      open: "Me conte sobre a última vez que você recebeu um feedback ou reconhecimento — o que fez ele parecer genuíno (ou não)?",
    },
    {
      key: "bem_estar",
      title: "Bem-estar e ambiente",
      sub: "Como você se sente no dia a dia e a estrutura ao seu redor.",
      questions: [
        { id: "bem_estar", text: "Eu me sinto bem, física e emocionalmente, no meu dia a dia de trabalho." },
        { id: "felicidade", text: "De forma geral, sou feliz trabalhando nesta área." },
        { id: "inovacao", text: "Sinto que tenho espaço para propor e testar novas ideias." },
        { id: "estrutura", text: "Tenho a estrutura (ferramentas, recursos, processos) necessária para fazer um bom trabalho." },
        { id: "suporte_estrutural", text: "Recebo o suporte necessário, estrutural e de recursos, da empresa/área." },
        { id: "relacionamento_interpessoal", text: "Tenho bons relacionamentos com meus colegas de equipe." },
      ],
      open: "Qual foi o momento do semestre em que você se sentiu mais (ou menos) bem trabalhando na área?",
    },
  ];

  const GENERAL_QUESTIONS = [
    { id: "gq_mudar", text: "Se você pudesse mudar uma coisa nesta área amanhã, sem medo de nenhuma consequência, o que seria?" },
    { id: "gq_momento", text: "Qual foi o momento do semestre em que você mais pensou “isso não devia ser assim”? Me dê um exemplo concreto." },
    { id: "gq_corresponsabilidade", text: "O que você, pessoalmente, poderia fazer diferente para ajudar a melhorar isso?" },
    { id: "gq_altagestao_comunicacao", text: "Você sente que as decisões da Alta Gestão chegam até você de forma clara, ou você entende as coisas mais por “ouvir dizer” do que por comunicação oficial?" },
    { id: "gq_altagestao_ressentimento", text: "Existe alguma decisão ou ação da Alta Gestão nos últimos meses que ainda te incomoda ou gerou algum ressentimento? Se sim, qual foi e por quê?" },
  ];

  const TOTAL_STEPS = CATEGORIES.length + 3; // intro + categories + perguntas gerais + comment/submit
  let state = { step: 0, answers: {}, openAnswers: {}, generalAnswers: {}, comment: "", submitting: false, error: "" };

  const app = document.getElementById("app");

  function scaleRow(qid, value) {
    let btns = "";
    for (let i = 0; i <= 10; i++) {
      const sel = value === i ? "selected" : "";
      btns += `<button type="button" class="${sel}" data-q="${qid}" data-v="${i}">${i}</button>`;
    }
    return `<div class="scale">${btns}</div><div class="scale-labels"><span>Discordo totalmente</span><span>Concordo totalmente</span></div>`;
  }

  function renderIntro() {
    return `
      <div class="step-label">Antes de começar</div>
      <h2 class="step-title">Sua opinião é importante</h2>
      <p class="step-sub">Suas respostas ajudam a entender melhor o momento atual da área.</p>
      <ul class="intro-points">
        <li><span class="ic">&#9679;</span> Leva cerca de 8 minutos: 4 blocos de temas + 1 bloco de perguntas abertas.</li>
        <li><span class="ic">&#9679;</span> Não pedimos seu nome — as respostas são anônimas.</li>
        <li><span class="ic">&#9679;</span> As notas vão de 0 (discordo totalmente) a 10 (concordo totalmente); as perguntas abertas são opcionais.</li>
      </ul>
      <div class="nav-row">
        <span></span>
        <button class="btn btn-primary" id="next">Começar</button>
      </div>
    `;
  }

  function renderCategory(cat, idx) {
    let qHtml = "";
    cat.questions.forEach(q => {
      qHtml += `
        <div class="question">
          <div class="q-text">${q.text}</div>
          ${scaleRow(q.id, state.answers[q.id])}
        </div>
      `;
    });
    qHtml += `
      <div class="question">
        <div class="q-text">${cat.open}</div>
        <textarea data-catopen="${cat.key}" placeholder="Sua resposta (opcional)...">${state.openAnswers[cat.key] || ""}</textarea>
      </div>
    `;
    return `
      <div class="step-label">Bloco ${idx + 1} de ${CATEGORIES.length}</div>
      <h2 class="step-title">${cat.title}</h2>
      <p class="step-sub">${cat.sub}</p>
      ${qHtml}
      <div class="hint" id="hint">Responda todas as notas deste bloco para continuar (a pergunta aberta é opcional).</div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="back">Voltar</button>
        <button class="btn btn-primary" id="next">Avançar</button>
      </div>
    `;
  }

  function renderGeneral() {
    let qHtml = "";
    GENERAL_QUESTIONS.forEach(q => {
      qHtml += `
        <div class="question">
          <div class="q-text">${q.text}</div>
          <textarea data-gq="${q.id}" placeholder="Sua resposta (opcional)...">${state.generalAnswers[q.id] || ""}</textarea>
        </div>
      `;
    });
    return `
      <div class="step-label">Bloco extra</div>
      <h2 class="step-title">Perguntas abertas</h2>
      <p class="step-sub">Todas opcionais — mas ajudam bastante a entender o "porquê" por trás das notas. Responda o que fizer sentido para você.</p>
      ${qHtml}
      <div class="nav-row">
        <button class="btn btn-ghost" id="back">Voltar</button>
        <button class="btn btn-primary" id="next">Avançar</button>
      </div>
    `;
  }

  function renderComment() {
    return `
      <div class="step-label">Último passo</div>
      <h2 class="step-title">Algo mais que queira compartilhar?</h2>
      <p class="step-sub">Opcional. Pode ser um ponto de alerta, uma sugestão ou algo que te deixaria mais feliz no trabalho.</p>
      <textarea id="comment" placeholder="Escreva aqui, se quiser...">${state.comment || ""}</textarea>
      <div class="nav-row">
        <button class="btn btn-ghost" id="back">Voltar</button>
        <button class="btn btn-gold" id="submit">${state.submitting ? "Enviando..." : "Enviar respostas"}</button>
      </div>
      ${state.error ? `<div class="hint show">${state.error}</div>` : ""}
    `;
  }

  function renderThanks() {
    return `
      <div class="thanks-icon">&#10003;</div>
      <h2 class="step-title">Obrigado por participar!</h2>
      <p class="step-sub">Sua resposta foi registrada de forma anônima. Obrigado por participar!</p>
    `;
  }

  function allAnsweredInCategory(cat) {
    return cat.questions.every(q => typeof state.answers[q.id] === "number");
  }

  function renderProgress() {
    if (state.step >= TOTAL_STEPS) return "";
    let dots = "";
    for (let i = 0; i < TOTAL_STEPS; i++) {
      let cls = "dot";
      if (i < state.step) cls += " done";
      else if (i === state.step) cls += " current";
      dots += `<div class="${cls}"></div>`;
    }
    return `<div class="progress-row">${dots}</div>`;
  }

  function render() {
    let body = "";
    if (state.step === 0) {
      body = renderIntro();
    } else if (state.step <= CATEGORIES.length) {
      body = renderCategory(CATEGORIES[state.step - 1], state.step - 1);
    } else if (state.step === CATEGORIES.length + 1) {
      body = renderGeneral();
    } else if (state.step === TOTAL_STEPS - 1) {
      body = renderComment();
    } else {
      body = renderThanks();
    }
    app.innerHTML = renderProgress() + body;
    attachHandlers();
  }

  function attachHandlers() {
    const nextBtn = document.getElementById("next");
    const backBtn = document.getElementById("back");
    const submitBtn = document.getElementById("submit");
    const commentEl = document.getElementById("comment");

    document.querySelectorAll(".scale button").forEach(btn => {
      btn.addEventListener("click", () => {
        const q = btn.getAttribute("data-q");
        const v = parseInt(btn.getAttribute("data-v"), 10);
        state.answers[q] = v;
        render();
      });
    });

    if (nextBtn) nextBtn.addEventListener("click", () => {
      if (state.step >= 1 && state.step <= CATEGORIES.length) {
        const cat = CATEGORIES[state.step - 1];
        if (!allAnsweredInCategory(cat)) {
          const hint = document.getElementById("hint");
          if (hint) hint.classList.add("show");
          return;
        }
      }
      state.step += 1;
      render();
    });

    if (backBtn) backBtn.addEventListener("click", () => {
      state.step -= 1;
      render();
    });

    if (commentEl) commentEl.addEventListener("input", (e) => {
      state.comment = e.target.value;
    });

    document.querySelectorAll("textarea[data-catopen]").forEach(ta => {
      ta.addEventListener("input", (e) => {
        state.openAnswers[ta.getAttribute("data-catopen")] = e.target.value;
      });
    });

    document.querySelectorAll("textarea[data-gq]").forEach(ta => {
      ta.addEventListener("input", (e) => {
        state.generalAnswers[ta.getAttribute("data-gq")] = e.target.value;
      });
    });

    if (submitBtn) submitBtn.addEventListener("click", submitSurvey);
  }

  async function submitSurvey() {
    state.submitting = true;
    state.error = "";
    render();
    const payload = {
      ts: Date.now(),
      answers: state.answers,
      openAnswers: state.openAnswers,
      generalAnswers: state.generalAnswers,
      comment: state.comment || "",
    };
    try {
      const res = await fetch(API_BASE + "/api/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      if (!res.ok) throw new Error("Falha no envio (" + res.status + ")");
      state.submitting = false;
      state.step += 1;
      render();
    } catch (err) {
      state.submitting = false;
      state.error = "Não foi possível enviar agora. Tente novamente em instantes.";
      render();
    }
  }

  render();
})();
</script>

</body>
</html>
